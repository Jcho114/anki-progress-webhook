[project]
name = "anki-webhook"
version = "0.1.0"
description = "Anki sync webhook PoC — add-on + Flask progress tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
anki-webhook-tracker = "server.tracker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.hatch.build.targets.wheel.force-include]
"server/templates" = "server/templates"
"server/static" = "server/static"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["server", "scripts", "addon"]
exclude = ["addon/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# vendor path must be on sys.path before importing webhook → requests
"addon/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
# Anki add-on imports (aqt/anki) are only available inside Anki.
include = ["server", "scripts", "tests"]
exclude = ["addon", "addon/vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
